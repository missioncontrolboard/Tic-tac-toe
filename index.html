<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon Space Tic-Tac-Toe</title>
<style>
  :root {
    --neon-blue: #00eaff;
    --neon-green: #39ff14;
    --warn: #ff2fd0;
    --bg: #04010c;
    --panel: #0a0620;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg);
    overflow-x: hidden;
    font-family: 'Segoe UI', 'Trebuchet MS', sans-serif;
  }

  #starfield {
    position: fixed;
    inset: 0;
    z-index: 0;
    background: radial-gradient(ellipse at 50% 0%, #0d0430 0%, var(--bg) 70%);
  }

  .star {
    position: absolute;
    background: #fff;
    border-radius: 50%;
    animation: twinkle linear infinite;
  }

  @keyframes twinkle {
    0%, 100% { opacity: 0.15; }
    50% { opacity: 1; }
  }

  .shooting-star {
    position: absolute;
    width: 2px;
    height: 2px;
    background: linear-gradient(90deg, #fff, transparent);
    border-radius: 50%;
    box-shadow: 0 0 6px 1px #fff;
    animation: shoot 6s linear infinite;
    opacity: 0;
  }

  @keyframes shoot {
    0% { transform: translate(0,0) rotate(-25deg); opacity: 0; }
    5% { opacity: 1; }
    15% { transform: translate(-420px, 220px) rotate(-25deg); opacity: 0; }
    100% { opacity: 0; }
  }

  .wrap {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px 16px 60px;
  }

  .subtitle {
    color: #8f8fb8;
    font-size: 0.85rem;
    text-align: center;
    max-width: 460px;
    margin-bottom: 22px;
    line-height: 1.5;
  }
  .subtitle b.b { color: var(--neon-blue); }
  .subtitle b.g { color: var(--neon-green); }

  #status {
    height: 34px;
    margin-bottom: 16px;
    font-size: 1.1rem;
    font-weight: 600;
    letter-spacing: 1px;
    text-align: center;
    color: #fff;
  }
  #status.turn-x { color: var(--neon-blue); text-shadow: 0 0 10px var(--neon-blue); }
  #status.turn-o { color: var(--neon-green); text-shadow: 0 0 10px var(--neon-green); }
  #status.win-x { color: var(--neon-blue); text-shadow: 0 0 16px var(--neon-blue), 0 0 40px var(--neon-blue); }
  #status.win-o { color: var(--neon-green); text-shadow: 0 0 16px var(--neon-green), 0 0 40px var(--neon-green); }

  #board {
    display: grid;
    grid-template-columns: repeat(3, minmax(72px, 100px));
    grid-template-rows: repeat(3, minmax(72px, 100px));
    gap: 8px;
    background: linear-gradient(135deg, rgba(0,234,255,0.08), rgba(57,255,20,0.08));
    padding: 8px;
    border-radius: 16px;
    border: 1px solid rgba(0,234,255,0.35);
    box-shadow: 0 0 30px rgba(0,234,255,0.15), inset 0 0 30px rgba(57,255,20,0.05);
  }

  .cell {
    background: var(--panel);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(2rem, 8vw, 3rem);
    font-weight: 700;
    cursor: pointer;
    user-select: none;
    position: relative;
    transition: border-color 0.2s, transform 0.08s, box-shadow 0.2s;
  }
  .cell:hover:not(.filled) {
    border-color: rgba(255,255,255,0.3);
    transform: translateY(-1px);
  }
  .cell.filled { cursor: default; }

  .cell .mark {
    animation: pop 0.22s ease-out;
  }
  @keyframes pop {
    0% { transform: scale(0.3); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }

  .mark.x { color: var(--neon-blue); text-shadow: 0 0 6px var(--neon-blue), 0 0 18px var(--neon-blue), 0 0 36px rgba(0,234,255,0.5); }
  .mark.o { color: var(--neon-green); text-shadow: 0 0 6px var(--neon-green), 0 0 18px var(--neon-green), 0 0 36px rgba(57,255,20,0.5); }

  .cell.vanish-warn .mark {
    animation: pulse-warn 1s ease-in-out infinite;
  }
  @keyframes pulse-warn {
    0%, 100% { opacity: 1; filter: drop-shadow(0 0 2px var(--warn)); }
    50% { opacity: 0.35; filter: drop-shadow(0 0 10px var(--warn)); }
  }

  .cell.win-cell {
    border-color: #fff;
    box-shadow: 0 0 18px 2px rgba(255,255,255,0.6);
  }

  #mode-select {
    display: flex;
    gap: 10px;
    margin-bottom: 18px;
  }

  .mode-btn {
    background: transparent;
    border: 1px solid rgba(255,255,255,0.25);
    color: #cfcfe8;
    padding: 8px 18px;
    border-radius: 999px;
    font-size: 0.8rem;
    letter-spacing: 1px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .mode-btn:hover {
    border-color: rgba(255,255,255,0.5);
  }
  .mode-btn.active {
    border-color: var(--neon-green);
    color: var(--neon-green);
    text-shadow: 0 0 6px var(--neon-green);
    box-shadow: 0 0 14px rgba(57,255,20,0.35);
  }

  #controls {
    margin-top: 22px;
    display: flex;
    gap: 14px;
  }

  button#reset {
    background: transparent;
    border: 1px solid var(--neon-blue);
    color: var(--neon-blue);
    padding: 10px 22px;
    border-radius: 999px;
    font-size: 0.9rem;
    letter-spacing: 1px;
    cursor: pointer;
    text-shadow: 0 0 6px var(--neon-blue);
    box-shadow: 0 0 12px rgba(0,234,255,0.25);
    transition: all 0.2s;
  }
  button#reset:hover {
    background: rgba(0,234,255,0.1);
    box-shadow: 0 0 20px rgba(0,234,255,0.5);
  }

  .scoreboard {
    display: flex;
    gap: 24px;
    margin-top: 18px;
    font-size: 0.85rem;
    color: #cfcfe8;
  }
  .scoreboard div span { font-weight: 700; }
  .scoreboard .sx span { color: var(--neon-blue); text-shadow: 0 0 6px var(--neon-blue); }
  .scoreboard .so span { color: var(--neon-green); text-shadow: 0 0 6px var(--neon-green); }

  footer {
    position: relative;
    z-index: 1;
    text-align: center;
    color: #4d4d6e;
    font-size: 0.72rem;
    padding-bottom: 18px;
  }

  /* ---------- Supernova win effect ---------- */
  #supernova-overlay {
    position: fixed;
    inset: 0;
    z-index: 50;
    pointer-events: none;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .nova-wash {
    position: absolute;
    inset: -25%;
    background: radial-gradient(circle, var(--nova-color) 0%, transparent 55%);
    opacity: 0;
    mix-blend-mode: screen;
    animation: nova-wash 2s ease-out forwards;
  }
  @keyframes nova-wash {
    0% { opacity: 0; }
    8% { opacity: 0.45; }
    100% { opacity: 0; }
  }

  .nova-flash {
    position: absolute;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 0 60px 30px #fff, 0 0 120px 60px var(--nova-color);
    animation: nova-flash 0.55s ease-out forwards;
  }
  @keyframes nova-flash {
    0% { transform: scale(0); opacity: 1; }
    35% { transform: scale(4); opacity: 1; }
    100% { transform: scale(8); opacity: 0; }
  }

  .nova-shock {
    position: absolute;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    border: 3px solid var(--nova-color);
    box-shadow: 0 0 24px var(--nova-color), inset 0 0 24px var(--nova-color);
    opacity: 0;
    animation: nova-shock 1.6s cubic-bezier(.15,.8,.3,1) forwards;
  }
  .nova-shock.delay {
    animation-delay: 0.28s;
    border-width: 2px;
  }
  @keyframes nova-shock {
    0% { transform: scale(0); opacity: 0.95; }
    100% { transform: scale(55); opacity: 0; }
  }

  .nova-ring {
    position: absolute;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: radial-gradient(circle, var(--nova-color) 0%, transparent 70%);
    animation: nova-ring 1.4s ease-out forwards;
    animation-delay: 0.1s;
    opacity: 0;
  }
  @keyframes nova-ring {
    0% { transform: scale(0); opacity: 0.9; }
    100% { transform: scale(38); opacity: 0; }
  }

  .nova-particle {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: var(--nova-color);
    box-shadow: 0 0 8px 2px var(--nova-color);
    animation: nova-particle 1.2s cubic-bezier(.1,.7,.3,1) forwards;
  }
  .nova-particle.ember {
    width: 2px;
    height: 2px;
    background: #fff;
    box-shadow: 0 0 6px 2px var(--nova-color);
    animation-duration: 1.6s;
    animation-timing-function: ease-out;
  }
  @keyframes nova-particle {
    0% { transform: translate(-50%, -50%) rotate(var(--angle)) translateX(0) scale(1); opacity: 1; }
    75% { opacity: 1; }
    100% { transform: translate(-50%, -50%) rotate(var(--angle)) translateX(var(--dist)) scale(0.3); opacity: 0; }
  }

  .nova-text-wrap {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0.6em 1.1em;
    border-radius: 18px;
    background: rgba(2, 0, 10, 0.55);
    border: 2px solid var(--nova-color);
    box-shadow: 0 0 0 4px rgba(0,0,0,0.85), 0 0 25px var(--nova-color), 0 0 70px var(--nova-color), inset 0 0 30px rgba(0,0,0,0.6);
    backdrop-filter: blur(2px);
    opacity: 0;
    transform: scale(2.2);
    filter: blur(6px);
    animation: nova-text 1s cubic-bezier(.15,1.6,.3,1) forwards;
    animation-delay: 0.3s;
  }

  .nova-text {
    font-size: clamp(2.8rem, 13vw, 7rem);
    font-weight: 900;
    font-family: 'Arial Black', 'Segoe UI', sans-serif;
    letter-spacing: 2px;
    color: #fff;
    -webkit-text-stroke: 3px var(--nova-color);
    paint-order: stroke fill;
    text-shadow:
      3px 3px 0 rgba(0,0,0,0.9),
      -1px -1px 0 rgba(0,0,0,0.9),
      0 0 18px var(--nova-color),
      0 0 40px var(--nova-color),
      0 0 90px var(--nova-color);
    white-space: nowrap;
  }
  @keyframes nova-text {
    0% { opacity: 0; transform: scale(2.2); filter: blur(10px); }
    12% { opacity: 1; transform: scale(0.9); filter: blur(0); }
    18% { opacity: 0.3; }
    24% { opacity: 1; }
    60% { opacity: 1; transform: scale(1.12); }
    100% { opacity: 1; transform: scale(1); }
  }

  @keyframes screen-shake {
    0%, 100% { transform: translate(0, 0); }
    20% { transform: translate(-6px, 4px); }
    40% { transform: translate(5px, -5px); }
    60% { transform: translate(-4px, -3px); }
    80% { transform: translate(6px, 3px); }
  }
  .wrap.shaking { animation: screen-shake 0.5s ease-out; }
</style>
</head>
<body>

<div id="starfield"></div>

<div class="wrap">
  <div id="mode-select">
    <button class="mode-btn active" id="mode-2p" type="button">2 PLAYER</button>
    <button class="mode-btn" id="mode-ai" type="button">VS AI</button>
  </div>

  <div id="status" class="turn-x">X's turn</div>

  <div id="board"></div>

  <div class="scoreboard">
    <div class="sx">Neon Blue (X): <span id="scoreX">0</span></div>
    <div class="so">Neon Green (O): <span id="scoreO">0</span></div>
  </div>

  <div id="controls">
    <button id="reset">RESTART GAME</button>
  </div>
</div>

<footer>Built with plain HTML/CSS/JS &mdash; no dependencies, works on GitHub Pages.</footer>

<script>
(function () {
  // ---------- Starfield ----------
  const starfield = document.getElementById('starfield');
  const STAR_COUNT = 140;
  for (let i = 0; i < STAR_COUNT; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    const size = Math.random() * 2 + 0.5;
    s.style.width = size + 'px';
    s.style.height = size + 'px';
    s.style.top = Math.random() * 100 + '%';
    s.style.left = Math.random() * 100 + '%';
    s.style.animationDuration = (Math.random() * 3 + 2) + 's';
    s.style.animationDelay = (Math.random() * 4) + 's';
    starfield.appendChild(s);
  }
  for (let i = 0; i < 4; i++) {
    const sh = document.createElement('div');
    sh.className = 'shooting-star';
    sh.style.top = (Math.random() * 60) + '%';
    sh.style.left = (60 + Math.random() * 35) + '%';
    sh.style.animationDelay = (Math.random() * 8) + 's';
    sh.style.animationDuration = (5 + Math.random() * 4) + 's';
    starfield.appendChild(sh);
  }

  // ---------- Game state ----------
  const boardEl = document.getElementById('board');
  const statusEl = document.getElementById('status');
  const resetBtn = document.getElementById('reset');
  const scoreXEl = document.getElementById('scoreX');
  const scoreOEl = document.getElementById('scoreO');
  const mode2pBtn = document.getElementById('mode-2p');
  const modeAiBtn = document.getElementById('mode-ai');

  const WIN_LINES = [
    [0,1,2],[3,4,5],[6,7,8],
    [0,3,6],[1,4,7],[2,5,8],
    [0,4,8],[2,4,6]
  ];

  let board = Array(9).fill(null);
  let queues = { X: [], O: [] };
  let current = 'X';
  let gameOver = false;
  let scores = { X: 0, O: 0 };
  let mode = '2p'; // '2p' or 'ai'
  const AI_PLAYER = 'O';
  let aiTimer = null;

  const cells = [];
  for (let i = 0; i < 9; i++) {
    const cell = document.createElement('div');
    cell.className = 'cell';
    cell.dataset.index = i;
    cell.addEventListener('click', () => handleClick(i));
    boardEl.appendChild(cell);
    cells.push(cell);
  }

  function handleClick(index) {
    if (gameOver || board[index] !== null) return;
    if (mode === 'ai' && current === AI_PLAYER) return; // ignore clicks during AI's turn
    makeMove(index);
  }

  function makeMove(index) {
    const queue = queues[current];

    if (queue.length === 3) {
      const vanished = queue.shift();
      board[vanished] = null;
    }

    board[index] = current;
    queue.push(index);

    render();

    const win = checkWin(current);
    if (win) {
      gameOver = true;
      scores[current]++;
      updateScoreboard();
      statusEl.textContent = (current === 'X' ? 'Neon Blue' : 'Neon Green') + ' wins!';
      statusEl.className = current === 'X' ? 'win-x' : 'win-o';
      win.forEach(i => cells[i].classList.add('win-cell'));
      triggerSupernova(current);
      return;
    }

    current = current === 'X' ? 'O' : 'X';
    updateStatus();

    if (!gameOver && mode === 'ai' && current === AI_PLAYER) {
      statusEl.textContent = 'AI is thinking...';
      aiTimer = setTimeout(aiMove, 550);
    }
  }

  function checkWin(player) {
    for (const line of WIN_LINES) {
      if (line.every(i => board[i] === player)) return line;
    }
    return null;
  }

  const AI_SEARCH_DEPTH = 6;

  function cloneState(state) {
    return {
      board: state.board.slice(),
      queues: { X: state.queues.X.slice(), O: state.queues.O.slice() }
    };
  }

  // Applies a move to a (cloned) state, handling the vanish rule, and
  // returns the resulting state without touching the live game state.
  function applyMoveToState(state, player, index) {
    const next = cloneState(state);
    const queue = next.queues[player];
    if (queue.length === 3) {
      const oldest = queue.shift();
      next.board[oldest] = null;
    }
    next.board[index] = player;
    queue.push(index);
    return next;
  }

  function getWinnerOf(boardArr) {
    for (const line of WIN_LINES) {
      const [a, b, c] = line;
      if (boardArr[a] && boardArr[a] === boardArr[b] && boardArr[a] === boardArr[c]) return boardArr[a];
    }
    return null;
  }

  function emptyCellsOf(boardArr) {
    const out = [];
    for (let i = 0; i < 9; i++) if (boardArr[i] === null) out.push(i);
    return out;
  }

  // Heuristic used once the search runs out of depth: rewards lines the
  // AI partially owns (and the opponent doesn't), penalizes the reverse.
  function evaluateState(state) {
    let score = 0;
    for (const line of WIN_LINES) {
      const vals = line.map(i => state.board[i]);
      const aiCount = vals.filter(v => v === AI_PLAYER).length;
      const oppCount = vals.filter(v => v === 'X').length;
      if (aiCount > 0 && oppCount === 0) score += aiCount * aiCount;
      else if (oppCount > 0 && aiCount === 0) score -= oppCount * oppCount;
    }
    return score;
  }

  // Minimax with alpha-beta pruning. Scores near-term wins/losses higher
  // than distant ones so the AI prefers the fastest win / slowest loss.
  function minimax(state, playerToMove, depth, alpha, beta) {
    const winner = getWinnerOf(state.board);
    if (winner === AI_PLAYER) return { score: 1000 + depth };
    if (winner && winner !== AI_PLAYER) return { score: -1000 - depth };
    if (depth === 0) return { score: evaluateState(state) };

    const moves = emptyCellsOf(state.board);
    let bestMove = moves[0];

    if (playerToMove === AI_PLAYER) {
      let best = -Infinity;
      for (const m of moves) {
        const nextState = applyMoveToState(state, playerToMove, m);
        const result = minimax(nextState, 'X', depth - 1, alpha, beta);
        if (result.score > best) { best = result.score; bestMove = m; }
        alpha = Math.max(alpha, best);
        if (beta <= alpha) break;
      }
      return { score: best, move: bestMove };
    } else {
      let best = Infinity;
      for (const m of moves) {
        const nextState = applyMoveToState(state, playerToMove, m);
        const result = minimax(nextState, AI_PLAYER, depth - 1, alpha, beta);
        if (result.score < best) { best = result.score; bestMove = m; }
        beta = Math.min(beta, best);
        if (beta <= alpha) break;
      }
      return { score: best, move: bestMove };
    }
  }

  function aiMove() {
    if (gameOver || current !== AI_PLAYER) return;
    const state = { board: board.slice(), queues: { X: queues.X.slice(), O: queues.O.slice() } };
    const result = minimax(state, AI_PLAYER, AI_SEARCH_DEPTH, -Infinity, Infinity);
    let choice = result.move;
    if (choice === undefined || choice === null || board[choice] !== null) {
      const opts = emptyCellsOf(board);
      choice = opts[Math.floor(Math.random() * opts.length)];
    }
    makeMove(choice);
  }

  function render() {
    for (let i = 0; i < 9; i++) {
      const cell = cells[i];
      cell.classList.remove('vanish-warn', 'win-cell');
      const val = board[i];
      if (val === null) {
        cell.innerHTML = '';
        cell.classList.remove('filled');
      } else {
        cell.classList.add('filled');
        cell.innerHTML = `<span class="mark ${val.toLowerCase()}">${val}</span>`;
      }
    }
    // mark the cell that will vanish next for the player about to move
    if (!gameOver) {
      const q = queues[current];
      if (q.length === 3) {
        cells[q[0]].classList.add('vanish-warn');
      }
    }
  }

  function updateStatus() {
    if (mode === 'ai' && current === AI_PLAYER) {
      statusEl.textContent = "AI's turn";
    } else {
      statusEl.textContent = (current === 'X' ? "Neon Blue's" : "Neon Green's") + ' turn';
    }
    statusEl.className = current === 'X' ? 'turn-x' : 'turn-o';
    // re-render to refresh vanish-warning highlight for the new current player
    render();
  }

  function updateScoreboard() {
    scoreXEl.textContent = scores.X;
    scoreOEl.textContent = scores.O;
  }

  function setMode(newMode) {
    if (mode === newMode) return;
    mode = newMode;
    mode2pBtn.classList.toggle('active', mode === '2p');
    modeAiBtn.classList.toggle('active', mode === 'ai');
    resetGame();
  }

  mode2pBtn.addEventListener('click', () => setMode('2p'));
  modeAiBtn.addEventListener('click', () => setMode('ai'));


  function triggerSupernova(player) {
    clearSupernova();

    const color = player === 'X'
      ? getComputedStyle(document.documentElement).getPropertyValue('--neon-blue').trim()
      : getComputedStyle(document.documentElement).getPropertyValue('--neon-green').trim();

    const overlay = document.createElement('div');
    overlay.id = 'supernova-overlay';
    overlay.style.setProperty('--nova-color', color);

    const wash = document.createElement('div');
    wash.className = 'nova-wash';
    overlay.appendChild(wash);

    const flash = document.createElement('div');
    flash.className = 'nova-flash';
    overlay.appendChild(flash);

    const shock1 = document.createElement('div');
    shock1.className = 'nova-shock';
    overlay.appendChild(shock1);

    const shock2 = document.createElement('div');
    shock2.className = 'nova-shock delay';
    overlay.appendChild(shock2);

    const ring = document.createElement('div');
    ring.className = 'nova-ring';
    overlay.appendChild(ring);

    const dotCount = 26;
    for (let i = 0; i < dotCount; i++) {
      const p = document.createElement('div');
      p.className = 'nova-particle';
      const angle = (360 / dotCount) * i + (Math.random() * 8 - 4);
      const dist = 160 + Math.random() * 200;
      p.style.setProperty('--angle', angle + 'deg');
      p.style.setProperty('--dist', dist + 'px');
      p.style.animationDelay = (Math.random() * 0.12) + 's';
      overlay.appendChild(p);
    }

    const emberCount = 22;
    for (let i = 0; i < emberCount; i++) {
      const p = document.createElement('div');
      p.className = 'nova-particle ember';
      const angle = Math.random() * 360;
      const dist = 220 + Math.random() * 260;
      p.style.setProperty('--angle', angle + 'deg');
      p.style.setProperty('--dist', dist + 'px');
      p.style.animationDelay = (Math.random() * 0.25) + 's';
      overlay.appendChild(p);
    }

    const textWrap = document.createElement('div');
    textWrap.className = 'nova-text-wrap';
    const text = document.createElement('div');
    text.className = 'nova-text';
    text.textContent = player === 'X' ? 'X WINS' : 'O WINS';
    textWrap.appendChild(text);
    overlay.appendChild(textWrap);

    document.body.appendChild(overlay);

    const wrapEl = document.querySelector('.wrap');
    wrapEl.classList.remove('shaking');
    void wrapEl.offsetWidth;
    wrapEl.classList.add('shaking');

    overlay._cleanup = setTimeout(() => overlay.remove(), 2600);
  }

  function clearSupernova() {
    const existing = document.getElementById('supernova-overlay');
    if (existing) {
      clearTimeout(existing._cleanup);
      existing.remove();
    }
  }

  function resetGame() {
    clearSupernova();
    clearTimeout(aiTimer);
    board = Array(9).fill(null);
    queues = { X: [], O: [] };
    current = 'X';
    gameOver = false;
    render();
    updateStatus();
  }

  resetBtn.addEventListener('click', resetGame);

  render();
  updateStatus();
})();
</script>

</body>
</html>
